@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10121c;--card:#191c2b;--tx:#e8eaf5;--mu:#98a0bd;--bd:#2a2e44;--ac:#8b85ff;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#10121c;--card:#191c2b;--tx:#e8eaf5;--mu:#98a0bd;--bd:#2a2e44;--ac:#8b85ff;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.w{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 16px;font-size:.92rem}
.sub a,.lnk{color:var(--ac)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.st{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.88rem;color:var(--mu)}
.st b{color:var(--tx)}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.it{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.it.done{opacity:.6}.it.done .nm{text-decoration:line-through}
.n{color:var(--mu);font-weight:700;min-width:1.8em}
input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.bd{flex:1;min-width:0}
.nm{font-weight:600}
.mt{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--mu);margin-top:3px;align-items:center}
.t{font-weight:700;color:#fff;border-radius:6px;padding:0 7px}
.tD{background:#6b7280}.tSp{background:#dc2626}.tS{background:#ea580c}.tA{background:#ca8a04}.tB{background:#2563eb}.tC{background:#6b7280}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.hd{margin:22px 0 4px;font-weight:700;color:var(--mu);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.ft{margin-top:24px;color:var(--mu);font-size:.8rem}
</style>
